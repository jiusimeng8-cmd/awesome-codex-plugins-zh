name: Sync upstream and refresh Chinese marketplace

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/hashgraph-online/awesome-codex-plugins.git || true
          git fetch upstream main
      - name: Sync installable plugins and source marketplace
        run: |
          git checkout upstream/main -- plugins plugins.json
          git show upstream/main:.agents/plugins/marketplace.json > translations/source-marketplace.json
      - name: Generate Chinese marketplace
        run: python scripts/build_zh_marketplace.py
      - name: Commit synchronized marketplace
        run: |
          if git diff --quiet; then
            echo "No upstream changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins plugins.json translations .agents/plugins/marketplace.json
          git commit -m "chore: sync upstream and refresh Chinese marketplace"
          git push origin HEAD:main

name: Validate localized marketplace syntax

on:
  pull_request:
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py
  push:
    branches: [main]
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - plugins/**
      - scripts/generate_plugins_json.py

permissions:
  contents: read
  id-token: none

jobs:
  validate:
    name: Check localized marketplace files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JSON syntax without regenerating English artifacts
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins.json >/dev/null

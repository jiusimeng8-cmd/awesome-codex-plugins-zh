display_name: "Reviewable HTML Workbench · 生成可审核的HTML文档"
short_description: "生成可审核的HTML文档"
default_prompt: "使用 Reviewable HTML Workbench 帮我：生成可审核的HTML文档"
trigger_examples:
  - html出力して
  - HTMLにして
  - HTMLで出して
  - この内容をHTMLで出して
  - HTMLでプレビューして
  - HTMLレンダラー
  - HTML出力を共通化
  - 図示つきHTML
  - visual HTML renderer
  - render this as HTML
  - turn this into HTML
  - create an HTML preview
  - generate a visual HTML report
  - make this a reviewable HTML document
  - diagrammed HTML report
entrypoint: python3 -m scripts.html_review_workbench.cli
working_directory: plugin_root
workflow:
  - attach-image
  - check-model
  - render
  - validate
  - preview

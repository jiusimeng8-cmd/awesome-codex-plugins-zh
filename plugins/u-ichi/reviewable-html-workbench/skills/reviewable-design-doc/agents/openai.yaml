display_name: "Reviewable HTML Workbench · 生成可审核的HTML文档"
short_description: "生成可审核的HTML文档"
default_prompt: "使用 Reviewable HTML Workbench 帮我：生成可审核的HTML文档"
trigger_examples:
  - レビュー可能な設計資料
  - 設計資料をHTMLで
  - design doc
  - reviewable design doc
  - レビュー終わったので確認して
  - コメントを反映して
  - create a reviewable design doc
  - make a design doc in HTML
  - build a review-ready design document
  - ingest review comments
  - process review comments
  - reply to review comments
  - apply resolved comments
entrypoint: python3 -m scripts.html_review_workbench.cli
working_directory: plugin_root
workflow:
  - attach-image
  - check-model
  - render
  - validate
  - preview
  - ingest-review
